<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SentinelFlow - Emergency Dispatch Control Room</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        #map { height: calc(100vh - 4rem); }
        .pulsing-hazard {
            animation: pulse-red 2s infinite;
        }
        @keyframes pulse-red {
            0% { transform: scale(0.95); opacity: 1; box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1); opacity: 0.8; box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); opacity: 1; box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans overflow-hidden">

    <header class="h-16 bg-gray-800 border-b border-gray-700 flex items-center justify-between px-6 shadow-md shadow-black/40">
        <div class="flex items-center space-x-3">
            <div class="h-3 w-3 rounded-full bg-emerald-500 animate-pulse"></div>
            <h1 class="text-xl font-bold tracking-wider text-emerald-400 font-mono">SENTINELFLOW CONTROL DASHBOARD</h1>
        </div>
        <div class="text-sm text-gray-400 flex items-center space-x-2">
            <span class="inline-block w-2 h-2 rounded-full bg-emerald-400"></span>
            <span>FastAPI Engine: <span class="text-emerald-400 font-semibold">Online</span></span>
        </div>
    </header>

    <div class="flex h-screen w-full">
        
        <aside class="w-1/3 bg-gray-800 p-6 space-y-6 overflow-y-auto border-r border-gray-700 pb-24">
            
            <div class="grid grid-cols-3 gap-3">
                <div class="bg-gray-900 p-3 rounded-lg border border-gray-700 text-center">
                    <div class="text-xs text-gray-400 uppercase font-bold">Total Techs</div>
                    <div id="statTotalTechs" class="text-xl font-black text-blue-400 mt-1">0</div>
                </div>
                <div class="bg-gray-900 p-3 rounded-lg border border-gray-700 text-center">
                    <div class="text-xs text-gray-400 uppercase font-bold">Available</div>
                    <div id="statActiveTechs" class="text-xl font-black text-emerald-400 mt-1">0</div>
                </div>
                <div class="bg-gray-900 p-3 rounded-lg border border-gray-700 text-center">
                    <div class="text-xs text-gray-400 uppercase font-bold">Hazards</div>
                    <div id="statTotalTasks" class="text-xl font-black text-rose-400 mt-1">0</div>
                </div>
            </div>
            
            <div class="bg-gray-900 p-4 rounded-lg border border-gray-700 shadow-xl">
                <h2 class="text-xs font-bold text-emerald-400 uppercase tracking-widest mb-3 flex items-center space-x-2">
                    <i class="fa-solid fa-user-plus"></i> <span>Onboard Field Technician</span>
                </h2>
                <div class="space-y-3">
                    <input id="techName" type="text" placeholder="Full Name" class="w-full bg-gray-800 border border-gray-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-emerald-500 text-white placeholder-gray-500">
                    <input id="techPhone" type="text" placeholder="Phone Number" class="w-full bg-gray-800 border border-gray-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-emerald-500 text-white placeholder-gray-500">
                    <div class="grid grid-cols-2 gap-2">
                        <input id="techLat" type="number" step="any" placeholder="Latitude (e.g. 11.016)" class="bg-gray-800 border border-gray-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-emerald-500 text-white placeholder-gray-500">
                        <input id="techLng" type="number" step="any" placeholder="Longitude (e.g. 76.955)" class="bg-gray-800 border border-gray-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-emerald-500 text-white placeholder-gray-500">
                    </div>
                    <button onclick="addTechnician()" class="w-full bg-emerald-600 hover:bg-emerald-500 transition text-white text-sm font-semibold py-2 rounded shadow-md">Register Technician</button>
                </div>
            </div>

            <div class="bg-gray-900 p-4 rounded-lg border border-gray-700 shadow-xl">
                <h2 class="text-xs font-bold text-rose-400 uppercase tracking-widest mb-3 flex items-center space-x-2">
                    <i class="fa-solid fa-triangle-exclamation"></i> <span>Log Emergency Incident</span>
                </h2>
                <div class="space-y-3">
                    <input id="taskTitle" type="text" placeholder="Incident Title (e.g. Cable Snap)" class="w-full bg-gray-800 border border-gray-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-rose-500 text-white placeholder-gray-500">
                    <textarea id="taskDesc" placeholder="Brief Description" class="w-full bg-gray-800 border border-gray-600 rounded px-3 py-2 text-sm h-16 focus:outline-none focus:border-rose-500 text-white placeholder-gray-500"></textarea>
                    <div class="grid grid-cols-2 gap-2">
                        <input id="taskLat" type="number" step="any" placeholder="Latitude" class="bg-gray-800 border border-gray-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-rose-500 text-white placeholder-gray-500">
                        <input id="taskLng" type="number" step="any" placeholder="Longitude" class="bg-gray-800 border border-gray-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-rose-500 text-white placeholder-gray-500">
                    </div>
                    <button onclick="addTask()" class="w-full bg-rose-600 hover:bg-rose-500 transition text-white text-sm font-semibold py-2 rounded shadow-md">Report Incident</button>
                </div>
            </div>

            <div class="bg-gray-900 p-4 rounded-lg border border-gray-700">
                <h2 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-2 flex items-center space-x-2">
                    <i class="fa-solid fa-terminal"></i> <span>Live Dispatch Terminal Logs</span>
                </h2>
                <div id="terminalLogs" class="bg-black text-green-400 font-mono text-xs p-3 rounded h-36 overflow-y-auto space-y-1 shadow-inner border border-gray-800">
                    <div>[SYSTEM] Custom spatial layers loaded. Engine operational.</div>
                </div>
            </div>
        </aside>

        <main class="w-2/3 relative">
            <div id="map" class="w-full bg-gray-950"></div>
        </main>
    </div>

    <script>
        const API_BASE = "http://172.25.16.1:8000/api";
        
        // Initialize interactive map focused natively over the project's regional development center
        const map = L.map('map', { zoomControl: false }).setView([11.0168, 76.9558], 14);
        L.control.zoom({ position: 'topright' }).addTo(map);

        // Load premium dark-theme responsive map layouts
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO'
        }).addTo(map);

        let techGroup = L.layerGroup().addTo(map);
        let taskGroup = L.layerGroup().addTo(map);

        function logToTerminal(message) {
            const logs = document.getElementById("terminalLogs");
            const entry = document.createElement("div");
            entry.className = "border-b border-gray-900 pb-1";
            entry.innerHTML = `<span class="text-gray-500">[${new Date().toLocaleTimeString()}]</span> ${message}`;
            logs.appendChild(entry);
            logs.scrollTop = logs.scrollHeight;
        }

        // --- Custom Icon Creators Using FontAwesome SVGs ---
        function createCustomIcon(iconClass, markerColor, pulse = false) {
            return L.divIcon({
                html: `<div class="flex items-center justify-center w-8 h-8 rounded-full shadow-lg ${pulse ? 'pulsing-hazard' : ''}" style="background-color: ${markerColor}; border: 2px solid #fff;">
                        <i class="${iconClass} text-white text-xs"></i>
                       </div>`,
                className: '',
                iconSize: [32, 32],
                iconAnchor: [16, 16]
            });
        }

        // --- Fetch Data and Redraw Live Layers ---
        async function refreshMapLayers() {
            try {
                techGroup.clearLayers();
                taskGroup.clearLayers();

                // 1. Fetch and Sync Field Technicians
                const techRes = await fetch(`${API_BASE}/technicians`);
                const technicians = await techRes.json();
                
                let availableTechsCount = 0;
                technicians.forEach(tech => {
                    if (tech.latitude && tech.longitude) {
                        const isAvailable = tech.status === 'available';
                        if (isAvailable) availableTechsCount++;
                        
                        const iconColor = isAvailable ? '#10B981' : '#F59E0B'; // Green vs Orange Alert
                        const techIcon = createCustomIcon('fa-solid fa-helmet-safety', iconColor);

                        L.marker([tech.latitude, tech.longitude], { icon: techIcon })
                            .addTo(techGroup)
                            .bindPopup(`
                                <div class="text-slate-900 font-sans p-1">
                                    <h3 class="font-bold border-b border-slate-200 pb-1 text-sm"><i class="fa-solid fa-id-card text-slate-500"></i> Field Crew</h3>
                                    <p class="mt-1"><b>Name:</b> ${tech.name}</p>
                                    <p><b>Phone:</b> ${tech.phone}</p>
                                    <p class="mt-1">Status: <span class="px-2 py-0.5 rounded text-xs font-bold text-white" style="background-color: ${iconColor};">${tech.status.toUpperCase()}</span></p>
                                </div>
                            `);
                    }
                });

                // 2. Fetch and Sync Emergency Hazards
                const taskRes = await fetch(`${API_BASE}/tasks`);
                const tasks = await taskRes.json();
                
                tasks.forEach(task => {
                    const isPending = task.status === 'pending';
                    const iconColor = isPending ? '#EF4444' : '#3B82F6'; // Red Fire vs Blue Assigned
                    const taskIcon = createCustomIcon(isPending ? 'fa-solid fa-fire-flame-curved' : 'fa-solid fa-circle-check', iconColor, isPending);

                    L.marker([task.latitude, task.longitude], { icon: taskIcon })
                        .addTo(taskGroup)
                        .bindPopup(`
                            <div class="text-slate-900 font-sans p-1 w-48">
                                <h3 class="font-bold border-b border-slate-200 pb-1 text-sm text-rose-600"><i class="fa-solid fa-burst"></i> ${task.title}</h3>
                                <p class="text-xs text-slate-600 mt-1">${task.description || 'No summary notes.'}</p>
                                <p class="mt-2 text-xs"><b>Status:</b> <span class="font-bold uppercase ${isPending ? 'text-rose-500' : 'text-blue-500'}">${task.status}</span></p>
                                ${isPending ? `<button onclick="dispatchIncident(${task.id})" class="w-full mt-3 text-xs bg-amber-500 hover:bg-amber-400 text-black font-black py-1.5 rounded transition shadow shadow-amber-600/50 flex items-center justify-center space-x-1"><i class="fa-solid fa-bolt"></i> <span>Run Auto-Dispatch</span></button>` : `<p class="text-xs text-slate-500 mt-1 border-t pt-1">Assigned Tech ID: <b>#${task.technician_id}</b></p>`}
                            </div>
                        `);
                });

                // Update UI Analytics counters instantly
                document.getElementById("statTotalTechs").innerText = technicians.length;
                document.getElementById("statActiveTechs").innerText = availableTechsCount;
                document.getElementById("statTotalTasks").innerText = tasks.length;

            } catch (err) {
                console.error("Failed syncing dashboard components:", err);
            }
        }

        // --- Action Handlers ---
        async function addTechnician() {
            const name = document.getElementById("techName").value;
            const phone = document.getElementById("techPhone").value;
            const latitude = parseFloat(document.getElementById("techLat").value);
            const longitude = parseFloat(document.getElementById("techLng").value);

            if(!name || !phone || isNaN(latitude) || isNaN(longitude)) return alert("Input values missing!");

            const res = await fetch(`${API_BASE}/technicians`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name, phone, latitude, longitude })
            });
            if(res.ok) {
                logToTerminal(`CREW ONBOARDED: <b>${name}</b> registered onto dispatch arrays.`);
                refreshMapLayers();
                document.getElementById("techName").value = '';
                document.getElementById("techPhone").value = '';
                document.getElementById("techLat").value = '';
                document.getElementById("techLng").value = '';
            }
        }

        async function addTask() {
            const title = document.getElementById("taskTitle").value;
            const description = document.getElementById("taskDesc").value;
            const latitude = parseFloat(document.getElementById("taskLat").value);
            const longitude = parseFloat(document.getElementById("taskLng").value);

            if(!title || isNaN(latitude) || isNaN(longitude)) return alert("Title and location coordinate variables required!");

            const res = await fetch(`${API_BASE}/tasks`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ title, description, latitude, longitude })
            });
            if(res.ok) {
                logToTerminal(`INCIDENT ALERT: Emergency telemetry logged for <b>${title}</b>.`);
                refreshMapLayers();
                document.getElementById("taskTitle").value = '';
                document.getElementById("taskDesc").value = '';
                document.getElementById("taskLat").value = '';
                document.getElementById("taskLng").value = '';
            }
        }

        async function dispatchIncident(taskId) {
            logToTerminal(`Executing spatial optimization algorithm for Threat Unit #${taskId}...`);
            const res = await fetch(`${API_BASE}/tasks/${taskId}/dispatch`, { method: "POST" });
            const data = await res.json();
            if(res.ok) {
                logToTerminal(`ALGORITHM SUCCESS: <span class="text-cyan-400">${data.message}</span>`);
                refreshMapLayers();
            } else {
                logToTerminal(`CRITICAL ERROR: <span class="text-rose-400">${data.detail}</span>`);
            }
        }

        // Continuous Polling Interval to maintain live socket synchronization updates
        setInterval(refreshMapLayers, 5000);
        window.onload = refreshMapLayers;
    </script>
</body>
</html>
